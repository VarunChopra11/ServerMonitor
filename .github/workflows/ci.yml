name: CI Test Suite

on:
  push:
    branches: [ main, feat/**, fix/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify zero external dependencies
        run: |
          echo "Verifying no non-standard dependencies are required..."
          python -c "import sys; print(f'Running Python {sys.version}')"

      - name: Run complete test suite
        run: |
          python -m unittest discover -v

      - name: Run resource benchmark
        run: |
          python server.py --benchmark
